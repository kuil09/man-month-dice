name: mission-fix-max-roll-timeout

on:
  push:
    branches: [feat/max-roll-timeout-fix]
    paths:
      - .github/workflows/mission-fix-max-roll-timeout.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/max-roll-timeout-fix

      - name: Patch bounded roll lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dice3d.js')
          s = p.read_text()
          s = s.replace(
              "const MAX_ROLL_TIME_MS = 9000;\nconst STABLE_TIME_MS = 620;",
              "const MAX_ROLL_TIME_MS = 5000;\nconst MAX_TOTAL_ROLL_TIME_MS = 12000;\nconst FAST_FORWARD_STEPS = 420;\nconst STABLE_TIME_MS = 520;"
          )
          s = s.replace(
              "    const settledValues = [];\n\n    while (pending.length) {",
              "    const settledValues = [];\n    const rollDeadline = performance.now() + MAX_TOTAL_ROLL_TIME_MS;\n\n    while (pending.length) {"
          )
          s = s.replace(
              "      await this.#settleBatch(batch, generation);",
              "      await this.#settleBatch(batch, generation, rollDeadline);"
          )
          old = '''  async #settleBatch(batch, generation) {\n    if (this.prefersReducedMotion.matches) {\n      let stableFrames = 0;\n      for (let step = 0; step < 720; step += 1) {\n        if (generation !== this.rollGeneration) return;\n        this.world.step(FIXED_TIME_STEP);\n        this.physicsSteps += 1;\n        this.#containBodies(batch);\n        if (bodiesAreQuiet(batch)) stableFrames += 1;\n        else stableFrames = 0;\n        if (stableFrames > 45) break;\n      }\n      for (const entry of batch) entry.body.sleep();\n      this.#syncAllBodies();\n      this.#fitCameraToVisibleBounds();\n      return;\n    }\n\n    await new Promise((resolve) => {\n      this.rollState = {\n        generation,\n        batch,\n        startedAt: performance.now(),\n        stableSince: 0,\n        resolve,\n      };\n    });\n  }\n'''
          new = '''  async #settleBatch(batch, generation, rollDeadline) {\n    const startedAt = performance.now();\n    const remaining = rollDeadline - startedAt;\n    if (this.prefersReducedMotion.matches || remaining <= 900) {\n      this.#fastForwardBatch(batch, generation);\n      return;\n    }\n\n    await new Promise((resolve) => {\n      this.rollState = {\n        generation,\n        batch,\n        startedAt,\n        deadline: Math.min(startedAt + MAX_ROLL_TIME_MS, rollDeadline),\n        stableSince: 0,\n        resolve,\n      };\n    });\n  }\n\n  #fastForwardBatch(batch, generation) {\n    let stableFrames = 0;\n    for (let step = 0; step < FAST_FORWARD_STEPS; step += 1) {\n      if (generation !== this.rollGeneration) return;\n      this.world.step(FIXED_TIME_STEP);\n      this.physicsSteps += 1;\n      this.#containBodies(batch);\n      if (bodiesAreQuiet(batch)) stableFrames += 1;\n      else stableFrames = 0;\n      if (stableFrames > 36) break;\n    }\n    for (const entry of batch) {\n      entry.body.velocity.setZero();\n      entry.body.angularVelocity.setZero();\n      entry.body.sleep();\n    }\n    this.#syncAllBodies();\n    this.#fitCameraToVisibleBounds();\n  }\n'''
          if old not in s:
              raise SystemExit('settleBatch source block not found')
          s = s.replace(old, new)
          s = s.replace(
              "    if (now - state.startedAt >= MAX_ROLL_TIME_MS) {",
              "    if (now >= state.deadline) {"
          )
          p.write_text(s)
          PY
          node --check dice3d.js
          grep -q 'MAX_TOTAL_ROLL_TIME_MS = 12000' dice3d.js
          grep -q '#fastForwardBatch' dice3d.js
          grep -q 'now >= state.deadline' dice3d.js

      - name: Browser regression test at maximum sliders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/max-roll-test
          mkdir -p _site/vendor /tmp/max-roll-test
          cp index.html styles.css app.js dice3d.js .nojekyll _site/
          cp vendor/* _site/vendor/
          cd /tmp/max-roll-test
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.55.0 >/dev/null
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => document.querySelector('#diceTray')?.dataset.renderer === 'three-cannon');
          await page.evaluate(() => {
            for (const input of document.querySelectorAll('[data-factor]')) {
              input.value = '4';
              input.dispatchEvent(new Event('input', { bubbles: true }));
            }
          });
          await page.waitForTimeout(150);
          for (let run = 0; run < 3; run += 1) {
            const started = Date.now();
            await page.click('#rollButton');
            await page.waitForFunction(() => {
              const tray = document.querySelector('#diceTray');
              const button = document.querySelector('#rollButton');
              return Boolean(tray?.dataset.lastRoll) && !button?.disabled && !tray.classList.contains('is-rolling');
            }, null, { timeout: 16000 });
            const elapsed = Date.now() - started;
            const state = await page.evaluate(() => ({
              total: Number(document.querySelector('#diceTray')?.dataset.lastRoll || 0),
              button: document.querySelector('#rollButton')?.textContent,
              rolling: document.querySelector('#diceTray')?.classList.contains('is-rolling'),
              debug: window.__MAN_MONTH_DICE_DEBUG__?.(),
            }));
            if (elapsed > 14500 || state.total <= 0 || state.rolling || state.button !== 'ROLL THE ESTIMATE') {
              throw new Error(`max roll did not recover: ${JSON.stringify({ elapsed, state })}`);
            }
            console.log(JSON.stringify({ run, elapsed, total: state.total, dice: state.debug?.dice?.length, physicsSteps: state.debug?.physicsSteps }));
          }
          if (errors.length) throw new Error(errors.join(' | '));
          await browser.close();
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/_site" >/tmp/max-roll-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          node smoke.mjs

      - name: Publish validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dice3d.js
          git diff --cached --check
          git commit -m 'fix: bound maximum dice roll completion time'
          git push origin HEAD:feat/max-roll-timeout-fix
