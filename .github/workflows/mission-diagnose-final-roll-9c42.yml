name: mission-diagnose-final-roll-9c42

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mission-diagnose-final-roll-9c42.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Record run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "run_id": "%s",\n  "source_commit": "%s"\n}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/run.json
          content="$(base64 -w0 /tmp/run.json)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/mission-final-roll-diagnostic-8a71f6.json?ref=feat/final-nonblocking-roll-8a71f6" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/mission-final-roll-diagnostic-8a71f6.json" -f message="chore: record roll diagnostic [skip ci]" -f content="$content" -f branch="feat/final-nonblocking-roll-8a71f6")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" >/dev/null
      - uses: actions/checkout@v6
        with:
          ref: feat/final-nonblocking-roll-8a71f6
      - name: Apply patch and prepare
        shell: bash
        run: |
          set -euo pipefail
          cat .agents/mission/final-roll-8a71f6.b64.* | base64 -d > /tmp/final-roll.patch
          echo "d7a0565da8275700b2a17946db172b89d2ce8fa36b6131689a2a7ad33b867e01  /tmp/final-roll.patch" | sha256sum -c -
          git apply /tmp/final-roll.patch
          rm -rf _site diagnostic /tmp/roll-diagnostic
          mkdir -p _site/vendor diagnostic /tmp/roll-diagnostic
          cp index.html styles.css app.js dice3d.js .nojekyll _site/
          cp vendor/* _site/vendor/
          cd /tmp/roll-diagnostic
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.55.0 >/dev/null
          cat > diagnose.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist'] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          const messages = [];
          page.on('pageerror', (error) => messages.push({ type: 'pageerror', text: error.stack || error.message }));
          page.on('console', async (message) => {
            const args = [];
            for (const arg of message.args()) {
              try { args.push(await arg.evaluate((value) => value instanceof Error ? { name: value.name, message: value.message, stack: value.stack } : String(value))); }
              catch { args.push(arg.toString()); }
            }
            messages.push({ type: `console:${message.type()}`, text: message.text(), args, location: message.location() });
          });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.evaluate(() => {
            window.__DIAGNOSTIC_ERRORS__ = [];
            window.addEventListener('error', (event) => window.__DIAGNOSTIC_ERRORS__.push({ type: 'error', message: event.message, stack: event.error?.stack || '' }));
            window.addEventListener('unhandledrejection', (event) => window.__DIAGNOSTIC_ERRORS__.push({ type: 'unhandledrejection', message: String(event.reason), stack: event.reason?.stack || '' }));
            localStorage.setItem('man-month-dice:poc:v1', JSON.stringify({ questName: 'MAX RISK', parallelism: 2, factors: { novelty:4, integration:4, dependency:4, verification:4, reversibility:4 }, history: [] }));
            location.reload();
          });
          await page.waitForFunction(() => document.querySelector('#diceTray')?.dataset.renderer === 'three-cannon', null, { timeout: 20000 });
          const before = await page.evaluate(() => window.__MAN_MONTH_DICE_DEBUG__?.());
          const startedAt = Date.now();
          await page.click('#rollButton');
          await page.waitForFunction(() => { const tray=document.querySelector('#diceTray'); const button=document.querySelector('#rollButton'); return Boolean(tray?.dataset.lastRoll) && !button?.disabled; }, null, { timeout: 11000 });
          const after = await page.evaluate(() => ({
            renderer: document.querySelector('#diceTray')?.dataset.renderer || '',
            physics: document.querySelector('#diceTray')?.dataset.physics || '',
            total: document.querySelector('#diceTray')?.dataset.lastRoll || '',
            button: document.querySelector('#rollButton')?.textContent || '',
            detail: document.querySelector('#rollDetail')?.textContent || '',
            debug: window.__MAN_MONTH_DICE_DEBUG__?.(),
            diagnosticErrors: window.__DIAGNOSTIC_ERRORS__ || [],
          }));
          const report = { elapsed: Date.now()-startedAt, before, after, messages };
          fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2)+'\n');
          await page.screenshot({ path: process.env.SCREENSHOT_PATH, fullPage: true });
          console.log('DIAGNOSTIC_REPORT='+JSON.stringify(report));
          await browser.close();
          NODE
      - name: Run diagnostic
        env:
          REPORT_PATH: ${{ github.workspace }}/diagnostic/report.json
          SCREENSHOT_PATH: ${{ github.workspace }}/diagnostic/screenshot.png
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/_site" >/tmp/roll-diagnostic-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          cd /tmp/roll-diagnostic
          node diagnose.mjs
          cat "$REPORT_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: final-roll-diagnostic-8a71f6
          path: diagnostic/
          retention-days: 3
