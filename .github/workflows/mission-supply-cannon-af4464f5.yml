name: mission-supply-cannon-af4464f5

on:
  push:
    branches: [mission/physics-source-af4464f5]
    paths:
      - .github/workflows/mission-supply-cannon-af4464f5.yml

permissions:
  contents: write

jobs:
  supply:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire cannon-es 0.20.0
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-work payload/vendor
          npm pack cannon-es@0.20.0 --pack-destination package-work --silent
          tar -xzf package-work/cannon-es-*.tgz -C package-work
          test "$(node -p "require('./package-work/package/package.json').version")" = "0.20.0"
          cp package-work/package/dist/cannon-es.js payload/vendor/cannon-es.js
          cp package-work/package/LICENSE payload/vendor/CANNON-ES-LICENSE.txt
          printf '{\n  "package": "cannon-es",\n  "version": "0.20.0"\n}\n' > payload/vendor/cannon-es-version.json
          (cd payload && sha256sum vendor/cannon-es.js vendor/CANNON-ES-LICENSE.txt vendor/cannon-es-version.json > SHA256SUMS)

      - name: Upload cannon-es payload
        uses: actions/upload-artifact@v4
        with:
          name: cannon-es-af4464f5
          path: payload
          retention-days: 1

      - name: Record supply result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mission.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "artifact": "cannon-es-af4464f5",
            "version": "0.20.0"
          }
          EOF
          content="$(base64 -w0 /tmp/mission.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/mission-cannon-af4464f5.json" \
            -f message="chore: record cannon-es supply [skip ci]" \
            -f content="$content" \
            -f branch="mission/physics-source-af4464f5" >/dev/null
