name: mission-export-bounds-source-2c46e8

on:
  push:
    branches: [feat/dice-screen-bounds-2c46e8]
    paths:
      - .github/workflows/mission-export-bounds-source-2c46e8.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/dice-screen-bounds-2c46e8

      - name: Pack source
        run: |
          tar --exclude=.git --exclude=_site -czf /tmp/man-month-dice-bounds-source-2c46e8.tgz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: man-month-dice-bounds-source-2c46e8
          path: /tmp/man-month-dice-bounds-source-2c46e8.tgz
          retention-days: 1

      - name: Record export run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/dice-bounds-source-run.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "source_commit": "${GITHUB_SHA}",
            "artifact": "man-month-dice-bounds-source-2c46e8"
          }
          EOF
          content="$(base64 -w0 /tmp/dice-bounds-source-run.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/mission-dice-bounds-source-2c46e8.json?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/mission-dice-bounds-source-2c46e8.json" -f message="chore: record dice bounds source export [skip ci]" -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$existing_sha" ]; then args+=(-f sha="$existing_sha"); fi
          gh api "${args[@]}" >/dev/null
