name: mission-supply-three-3d988f25

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mission-supply-three-3d988f25.yml

permissions:
  contents: write

jobs:
  supply:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire official Three.js npm package
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/vendor package-work
          npm pack three@latest --pack-destination package-work
          tar -xzf package-work/three-*.tgz -C package-work
          VERSION=$(node -p "require('./package-work/package/package.json').version")
          if [ -f package-work/package/build/three.module.min.js ]; then
            cp package-work/package/build/three.module.min.js payload/vendor/three.module.min.js
          else
            cp package-work/package/build/three.module.js payload/vendor/three.module.min.js
          fi
          cp package-work/package/LICENSE payload/vendor/THREE-LICENSE.txt
          printf '{\n  "package": "three",\n  "version": "%s"\n}\n' "$VERSION" > payload/vendor/three-version.json
          (cd payload && sha256sum vendor/three.module.min.js vendor/THREE-LICENSE.txt vendor/three-version.json > SHA256SUMS)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload verified Three.js payload
        uses: actions/upload-artifact@v4
        with:
          name: three-supply-3d988f25
          path: payload
          retention-days: 1

      - name: Checkout status branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: status

      - name: Record supply result
        working-directory: status
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          THREE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          cat > mission-three-3d988f25.json <<EOF
          {
            "run_id": "${RUN_ID}",
            "run_attempt": "${RUN_ATTEMPT}",
            "artifact": "three-supply-3d988f25",
            "three_version": "${THREE_VERSION}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mission-three-3d988f25.json
          git commit -m "chore: record Three.js supply mission [skip ci]"
          git push origin HEAD:main
