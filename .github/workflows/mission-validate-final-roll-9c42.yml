name: mission-validate-final-roll-9c42

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mission-validate-final-roll-9c42.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Record validation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "state": "started",\n  "run_id": "%s",\n  "source_commit": "%s"\n}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/run.json
          content="$(base64 -w0 /tmp/run.json)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/mission-final-roll-run-8a71f6.json?ref=feat/final-nonblocking-roll-8a71f6" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/mission-final-roll-run-8a71f6.json" \
            -f message="chore: record final roll validation run [skip ci]" \
            -f content="$content" -f branch="feat/final-nonblocking-roll-8a71f6")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/final-nonblocking-roll-8a71f6

      - name: Restore and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .agents/mission -maxdepth 1 -name 'final-roll-8a71f6.b64.*' | wc -l)" -eq 10
          cat .agents/mission/final-roll-8a71f6.b64.* | base64 -d > /tmp/final-roll-8a71f6.patch
          echo "d7a0565da8275700b2a17946db172b89d2ce8fa36b6131689a2a7ad33b867e01  /tmp/final-roll-8a71f6.patch" | sha256sum -c -
          git apply --check /tmp/final-roll-8a71f6.patch
          git apply /tmp/final-roll-8a71f6.patch
          node --input-type=module --check < dice3d.js
          node --input-type=module --check < app.js
          grep -q 'MAX_TOTAL_ROLL_TIME_MS = 6800' dice3d.js
          grep -q 'SETTLE_WATCHDOG_GRACE_MS = 120' dice3d.js
          grep -q 'faceMapCache = new Map' dice3d.js
          grep -q '#fastForwardBatch' dice3d.js
          grep -q '#retireBody' dice3d.js
          grep -q 'cancelActiveRoll' dice3d.js
          grep -q 'yieldToBrowser' dice3d.js
          grep -q 'UI watchdog ended an over-budget roll' app.js
          ! grep -q 'material.map?.dispose' dice3d.js
          git diff --check

      - name: Prepare browser harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site smoke-output /tmp/final-roll-browser
          mkdir -p _site/vendor smoke-output /tmp/final-roll-browser
          cp index.html styles.css app.js dice3d.js .nojekyll _site/
          cp vendor/* _site/vendor/
          cd /tmp/final-roll-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.55.0 >/dev/null
          cat > smoke.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist'],
          });
          const scenarios = [
            { name: 'desktop', width: 1440, height: 1100, runs: 4 },
            { name: 'mobile', width: 390, height: 844, runs: 3 },
          ];
          const report = {};

          for (const scenario of scenarios) {
            const context = await browser.newContext({ viewport: { width: scenario.width, height: scenario.height }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
            page.on('console', (message) => {
              const url = message.location().url || '';
              if (message.type() === 'error' && !url.endsWith('/favicon.ico')) errors.push(`console: ${message.text()} @ ${url}`);
            });
            await page.goto(`http://127.0.0.1:4173/?scenario=${scenario.name}`, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => document.querySelector('#diceTray')?.dataset.renderer === 'three-cannon', null, { timeout: 20000 });
            await page.evaluate(() => {
              localStorage.clear();
              window.__ROLL_HEARTBEAT__ = { last: performance.now(), maxGap: 0, count: 0 };
              window.setInterval(() => {
                const now = performance.now();
                const heartbeat = window.__ROLL_HEARTBEAT__;
                heartbeat.maxGap = Math.max(heartbeat.maxGap, now - heartbeat.last);
                heartbeat.last = now;
                heartbeat.count += 1;
              }, 50);
            });

            for (let cycle = 0; cycle < 10; cycle += 1) {
              await page.evaluate((value) => {
                for (const input of document.querySelectorAll('[data-factor]')) {
                  input.value = String(value);
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                }
              }, cycle % 5);
            }
            await page.evaluate(() => {
              for (const input of document.querySelectorAll('[data-factor]')) {
                input.value = '4';
                input.dispatchEvent(new Event('input', { bubbles: true }));
              }
            });
            await page.waitForTimeout(250);

            const initial = await page.evaluate(() => window.__MAN_MONTH_DICE_DEBUG__?.());
            if (!initial || initial.cache.faceMaps > 12 || initial.cache.dieTemplates > 5 || initial.cache.materialTemplates > 40) {
              throw new Error(`${scenario.name}: cache is unbounded: ${JSON.stringify(initial)}`);
            }

            const runs = [];
            for (let run = 0; run < scenario.runs; run += 1) {
              await page.evaluate(() => {
                window.__ROLL_HEARTBEAT__.last = performance.now();
                window.__ROLL_HEARTBEAT__.maxGap = 0;
                window.__ROLL_HEARTBEAT__.count = 0;
              });
              const startedAt = Date.now();
              await page.click('#rollButton');
              await page.waitForFunction(() => document.querySelector('#diceTray')?.classList.contains('is-rolling'), null, { timeout: 3000 });
              await page.waitForFunction(() => {
                const tray = document.querySelector('#diceTray');
                const button = document.querySelector('#rollButton');
                return Boolean(tray?.dataset.lastRoll) && !button?.disabled && !tray.classList.contains('is-rolling');
              }, null, { timeout: 10000 });
              const elapsed = Date.now() - startedAt;
              const state = await page.evaluate(() => ({
                total: Number(document.querySelector('#diceTray')?.dataset.lastRoll || 0),
                button: document.querySelector('#rollButton')?.textContent || '',
                renderer: document.querySelector('#diceTray')?.dataset.renderer || '',
                physics: document.querySelector('#diceTray')?.dataset.physics || '',
                rolling: document.querySelector('#diceTray')?.classList.contains('is-rolling') || false,
                heartbeat: window.__ROLL_HEARTBEAT__,
                debug: window.__MAN_MONTH_DICE_DEBUG__?.(),
              }));
              if (elapsed > 9500 || state.total <= 0 || state.rolling || state.button !== 'ROLL THE ESTIMATE') {
                throw new Error(`${scenario.name}/${run}: roll did not recover: ${JSON.stringify({ elapsed, state })}`);
              }
              if (state.renderer !== 'three-cannon' || state.physics !== 'cannon-es' || state.debug?.rollLifecycle !== 'completed' || state.debug?.activeRoll) {
                throw new Error(`${scenario.name}/${run}: 3D lifecycle degraded: ${JSON.stringify(state)}`);
              }
              if (!state.debug?.allDiceInsideViewport || state.debug?.maxViewportOverflow !== 0) {
                throw new Error(`${scenario.name}/${run}: dice left viewport: ${JSON.stringify(state.debug)}`);
              }
              if (state.heartbeat.maxGap > 1400 || state.heartbeat.count < 2) {
                throw new Error(`${scenario.name}/${run}: main thread stalled: ${JSON.stringify(state.heartbeat)}`);
              }
              if (state.debug.cache.faceMaps > 12 || state.debug.cache.dieTemplates > 5 || state.debug.cache.materialTemplates > 40) {
                throw new Error(`${scenario.name}/${run}: cache grew without bound: ${JSON.stringify(state.debug.cache)}`);
              }
              runs.push({ elapsed, total: state.total, heartbeat: state.heartbeat, debug: state.debug });
            }
            if (errors.length) throw new Error(`${scenario.name}: ${errors.join(' | ')}`);
            await page.screenshot({ path: `${process.env.OUTPUT_DIR}/${scenario.name}.png`, fullPage: true });
            report[scenario.name] = { viewport: { width: scenario.width, height: scenario.height }, initial, runs, errors };
            await context.close();
          }

          fs.writeFileSync(process.env.REPORT_PATH, `${JSON.stringify(report, null, 2)}\n`);
          await browser.close();
          NODE

      - name: Run maximum-risk browser stress test
        shell: bash
        env:
          OUTPUT_DIR: ${{ github.workspace }}/smoke-output
          REPORT_PATH: ${{ github.workspace }}/smoke-output/report.json
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/_site" >/tmp/final-roll-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          cd /tmp/final-roll-browser
          node smoke.mjs
          test -s "$REPORT_PATH"
          test -s "$OUTPUT_DIR/desktop.png"
          test -s "$OUTPUT_DIR/mobile.png"

      - name: Publish validated source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          with open('smoke-output/report.json', encoding='utf-8') as handle:
              browser = json.load(handle)
          payload = {
              'validated_source': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'bounded_total_roll': 'success',
              'per_batch_watchdog': 'success',
              'event_loop_yielding': 'success',
              'shared_texture_cache': 'success',
              'retired_settled_bodies': 'success',
              'desktop_max_risk': 'success',
              'mobile_max_risk': 'success',
              'browser': browser,
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          with open('mission-final-roll-validation-8a71f6.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dice3d.js app.js README.POC.md mission-final-roll-validation-8a71f6.json
          git diff --cached --check
          git commit -m 'fix: make maximum-risk rolls non-blocking and bounded'
          git push origin HEAD:feat/final-nonblocking-roll-8a71f6

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-nonblocking-roll-validation-8a71f6
          path: |
            smoke-output/
            /tmp/final-roll-http.log
          if-no-files-found: warn
          retention-days: 3
